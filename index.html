<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --ink:#14201D; --muted:#5B6B66; --line:#D5DDD9;
  --accent:#0E6B5E; --accent-ink:#FFFFFF; --accent-soft:#DCEEE9; --amber:#B4600F; --amber-soft:#F6E6D3;
  --shadow:0 1px 2px rgba(20,32,29,.06),0 6px 20px rgba(20,32,29,.06);
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1614; --surface:#15211E; --ink:#E6EFEC; --muted:#93A6A0; --line:#27362F;
    --accent:#56C6B3; --accent-ink:#06211C; --accent-soft:#163630; --amber:#E39A4E; --amber-soft:#3A2A16;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#15211E; --ink:#E6EFEC; --muted:#93A6A0; --line:#27362F;
  --accent:#56C6B3; --accent-ink:#06211C; --accent-soft:#163630; --amber:#E39A4E; --amber-soft:#3A2A16;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.phase{display:inline-block;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.sel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sel select{font:inherit;font-weight:600;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;flex:1;min-width:220px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.banner{background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:.92rem;margin-bottom:16px}
.banner b{color:var(--amber)}
.session{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.session .focus{font-family:var(--display);font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.barlabel{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
details.block{background:var(--surface);border-radius:14px;margin-bottom:12px;border:1px solid var(--line)}
details.block summary{list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.block summary::-webkit-details-marker{display:none}
details.block summary::after{content:"+";font-size:1.3rem;color:var(--muted)}
details.block[open] summary::after{content:"–"}
.checks{padding:0 16px 14px;display:grid;gap:10px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.ex{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ex-num{font-family:var(--display);font-weight:800;color:var(--accent);font-size:.9rem}
.ex h3{margin:2px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--muted);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.chip.rx{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.88rem;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.big{width:100%;padding:14px;font-size:1rem;border-radius:14px}
.last{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.sugg{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.sugg b{font-family:var(--display);font-size:1.15rem;color:var(--accent);letter-spacing:-.01em}
.sugg small{color:var(--muted);font-size:.8rem}
.set.barz label input{padding-right:52px}
.opt{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:14px}
textarea.csv{width:100%;height:180px;font:.72rem/1.4 ui-monospace,Menlo,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:10px 0}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:44px 1fr 1fr 44px;gap:8px;align-items:center}
.set.noload{grid-template-columns:44px 1fr 44px}
.set .n{font-weight:700;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.set label{display:block;position:relative}
.set input[type=text]{width:100%;font:inherit;font-weight:600;padding:10px 34px 10px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;min-width:0}
.set label span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--muted);pointer-events:none}
.set .ok{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;color:transparent}
.set.done .ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.done input{opacity:.65}
.week{display:grid;gap:10px}
.wrow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.wrow.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wrow header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.wcells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wcell{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 6px;text-align:center;font-weight:600;font-size:.85rem}
.wcell small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.wcell.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wcell.done small{color:var(--accent-ink);opacity:.85}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0 4px}
.cal div{border-radius:10px;padding:8px 2px;text-align:center;font-size:.72rem;font-weight:700;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.cal div b{display:block;font-size:.66rem;font-weight:600;margin-top:2px}
.cal .s{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.cal .p{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.cal .w{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin-bottom:8px}
.card ul{margin:0;padding-left:18px;display:grid;gap:6px}
.rpe{display:grid;grid-template-columns:40px 1fr;gap:6px 10px;font-size:.92rem;align-items:baseline}
.rpe b{font-family:var(--display);color:var(--accent);font-size:1.05rem}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{flex:1;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px;font-size:.72rem;font-weight:700;color:var(--muted);border-radius:12px}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.rest{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:30;box-shadow:var(--shadow);max-width:616px;margin-inline:auto}
.rest .t{font-family:var(--display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.rest button{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:10px;padding:6px 12px;font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet ol{padding-left:22px;display:grid;gap:8px;margin:10px 0 16px}
.sheet ul{padding-left:20px;display:grid;gap:6px;margin:10px 0 16px}
.sheet h4{font-family:var(--display);font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.tip{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.93rem}
.illuswrap{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:10px}
.fig{width:100%;max-width:220px;display:block;margin:0 auto}
.fig .floor{stroke:var(--line);stroke-width:2}
.fig .body line{stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.fig .body circle{fill:var(--surface);stroke:var(--ink);stroke-width:5}
.gearline{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.gear{fill:var(--accent)}
.bench{fill:var(--surface);stroke:var(--muted);stroke-width:3}
.band{stroke:var(--accent);stroke-width:3;fill:none;stroke-dasharray:4 3}
.x{float:right}
a.btn{text-decoration:none;display:inline-block;text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>


</head>

<script>
/* ---------- DATOS ---------- */
const REPS_DEFAULT=['12','12','10–12','10–12','8–10','8–10'];
const SETS=[2,2,3,3,3,3];
const REST=[60,60,75,75,90,90];
const WALK=[30,30,35,35,40,40];
const ISO=[45,45,60,60,60,60];
const TRANS=75;
const TWO=[2,2,2,2,2,2];
const PHASES=[
 {n:'Aprender',d:'Técnica primero. Pesos livianos, sobrando 4 repeticiones.',rpe:6},
 {n:'Aprender',d:'Técnica primero. Pesos livianos, sobrando 4 repeticiones.',rpe:6},
 {n:'Construir',d:'Una serie más. Sube peso si todas las series salen limpias.',rpe:7},
 {n:'Construir',d:'Una serie más. Sube peso si todas las series salen limpias.',rpe:7},
 {n:'Cargar',d:'Más peso, menos repeticiones. Sobran 2 repeticiones.',rpe:8},
 {n:'Cargar',d:'Más peso, menos repeticiones. Sobran 2 repeticiones.',rpe:8}
];
const EX={
 goblet:{c:1,name:'Sentadilla goblet',eq:'Mancuerna o disco',mu:'Piernas y glúteos',loaded:true,start:'Parte con 4–6 kg',
  yt:'sentadilla goblet técnica principiantes',
  steps:['Sostén la mancuerna vertical contra el pecho con ambas manos, codos hacia abajo.','Pies al ancho de los hombros, puntas levemente hacia afuera.','Inspira, lleva la cadera atrás y abajo como sentándote en una silla, con el pecho arriba.','Baja hasta donde mantengas la espalda recta (idealmente muslos paralelos al suelo).','Empuja el piso con todo el pie y sube exhalando.'],
  err:['Las rodillas se van hacia adentro: empújalas hacia afuera, siguiendo la línea de los pies.','Los talones se despegan: reparte el peso en todo el pie.','La espalda se redondea abajo: baja menos.'],
  tip:'Deja una silla o la banca detrás y roza suavemente con los glúteos: te enseña la profundidad justa.'},
 rdl:{c:1,name:'Peso muerto rumano con barra Z',eq:'Barra Z con discos',mu:'Isquiotibiales y glúteos',loaded:true,start:'Parte con la barra sola',
  yt:'peso muerto rumano barra Z técnica',
  steps:['De pie, pies al ancho de la cadera, barra Z frente a los muslos con agarre desde arriba.','Rodillas levemente flexionadas, hombros atrás y abajo, abdomen firme.','Lleva la cadera hacia atrás, como cerrando una puerta con el glúteo. La barra baja pegada a las piernas.','Baja hasta sentir estiramiento atrás del muslo, con la espalda neutra.','Aprieta los glúteos y lleva la cadera adelante para subir.'],
  err:['Redondear la espalda: baja menos, mira un punto en el suelo unos 2 m adelante.','Doblar demasiado las rodillas: se convierte en sentadilla.','Dejar la barra lejos del cuerpo.'],
  tip:'Es un movimiento de cadera, no de espalda. Si sientes la zona lumbar, baja el peso.'},
 hipthrust:{c:1,name:'Puente de glúteos en banca',eq:'Banca + barra Z o mancuerna',mu:'Glúteos',loaded:true,start:'Parte sin peso o con 4 kg',
  yt:'hip thrust en banca técnica principiantes',
  steps:['Siéntate en el suelo con la parte alta de la espalda (omóplatos) apoyada en el borde de la banca.','Apoya la barra Z o una mancuerna sobre la cadera, con una toalla doblada como almohadilla.','Pies planos y al ancho de la cadera.','Empuja con los talones y sube la cadera hasta que tronco y muslos queden en línea.','Pausa 1–2 segundos apretando glúteos, con el mentón hacia el pecho. Baja controlado.'],
  err:['Arquear la zona lumbar arriba: termina el movimiento con glúteos, no con la espalda.','Que la banca se corra: apóyala contra una pared.','Pies muy lejos o muy cerca: arriba la espinilla debe quedar vertical.'],
  tip:'Asegura los discos con seguros o collares antes de cada serie.'},
 transv:{sets:TWO,r:30,name:'Activación del transverso con respiración',eq:'Tapete o suelo',mu:'Abdomen profundo y piso pélvico',loaded:false,reps:['8 resp.','8 resp.','10 resp.','10 resp.','10 resp.','10 resp.'],
  steps:['Acostada boca arriba, rodillas dobladas y pies apoyados en el suelo. Una mano en las costillas y otra bajo el ombligo.','Inhala por la nariz y siente cómo las costillas se abren hacia los lados, sin empujar el abdomen hacia afuera.','Exhala lento por la boca, como soplando por una pajita: junta suavemente las costillas y lleva el ombligo hacia adentro, sin apretar fuerte.','Al final de cada exhalación, agrega una contracción suave del piso pélvico, como levantándolo hacia adentro y arriba.','Cuando lo controles, agrega el deslizamiento de talón: exhalando, estira lentamente una pierna sin que la pelvis se mueva, y vuelve.'],
  err:['Empujar el abdomen hacia afuera o formar un bulto en la línea media.','Apretar glúteos, muslos o mandíbula.','Contener la respiración.'],
  tip:'Es un trabajo suave, del 20–30% de esfuerzo. Lo importante es la coordinación, no la fuerza.'},
 bench:{c:1,name:'Press de pecho con mancuernas',eq:'Banca + mancuernas',mu:'Pecho, hombros y tríceps',loaded:true,start:'Parte con 3–4 kg por mano',
  yt:'press de pecho con mancuernas en banca técnica',
  steps:['Acostada en la banca, pies firmes en el suelo, mancuernas sobre el pecho.','Junta los omóplatos y llévalos hacia abajo, pecho arriba.','Baja controlado hasta que los codos queden a unos 45° del tronco.','Empuja hacia arriba sin bloquear del todo los codos.'],
  err:['Codos abiertos a 90°: cuida los hombros, ciérralos a 45°.','Arquear mucho la zona lumbar.','Rebotar abajo.'],
  tip:'Sube y baja las mancuernas sentada en el borde de la banca antes de acostarte, para cuidar los hombros.'},
 row:{c:1,name:'Remo con mancuerna en banca',eq:'Banca + mancuerna',mu:'Espalda y bíceps',loaded:true,side:true,start:'Parte con 4–6 kg',
  yt:'remo con mancuerna apoyado en banca técnica',
  steps:['Rodilla y mano del mismo lado sobre la banca; el otro pie en el suelo.','Espalda paralela al suelo y neutra, mancuerna colgando.','Tira el codo hacia la cadera, no hacia el hombro.','Pausa 1 segundo arriba y baja controlado.','Termina todas las repeticiones y cambia de lado.'],
  err:['Girar el torso para subir más peso.','Encoger el hombro hacia la oreja.','Jalar con el bíceps: piensa en “codo a la cadera”.'],
  tip:'Imagina que guardas la mancuerna en el bolsillo trasero.'},
 ohp:{c:1,name:'Press de hombros sentada',eq:'Banca + mancuernas',mu:'Hombros y tríceps',loaded:true,start:'Parte con 2–3 kg por mano',
  yt:'press de hombros con mancuernas sentada técnica',
  steps:['Sentada en el borde de la banca, espalda erguida y abdomen firme.','Mancuernas a la altura de las orejas, palmas al frente.','Empuja hacia arriba hasta casi extender los codos.','Baja controlado hasta la altura de las orejas.'],
  err:['Arquear la zona lumbar: aprieta abdomen.','Encoger los hombros hacia las orejas.','Usar demasiado peso.'],
  tip:'Es el ejercicio donde conviene subir más despacio.'},
 pull:{sets:TWO,name:'Apertura con banda',eq:'Banda elástica',mu:'Espalda alta y hombros',loaded:false,reps:['15','15','15','15','15','15'],
  yt:'band pull apart apertura con banda técnica',
  steps:['Sujeta la banda con ambas manos al ancho de los hombros, brazos extendidos al frente.','Separa las manos llevando la banda hacia el pecho.','Junta los omóplatos al final del movimiento.','Vuelve controlado.'],

 let h='<div class="topline"><div><div class="eyebrow">Antes de partir</div><h1>Guía</h1></div></div>';
 h+='<div class="card"><h3>Descansos y duración</h3><ul><li>Entre series: 60 a 90 s en los ejercicios pesados (sentadilla, peso muerto, puente de glúteos, presses, remos, zancada) y 45 a 60 s en los complementarios. Respiración y piso pélvico: 30 s.</li><li>Entre ejercicios: unos 75 s para cambiar pesos, tomar agua y acomodar la banca.</li><li>La app parte el temporizador al marcar cada serie y avisa con el siguiente ejercicio.</li><li>Duración total: entre 34 y 55 minutos según la semana, con calentamiento y enfriamiento incluidos. El día más largo es siempre el jueves, entre 43 y 55 min.</li><li>No acortes los descansos de los ejercicios pesados: se necesita ese tiempo para levantar con buena técnica. Si necesitas más, tómate 30 s extra.</li><li>Si un día tienes poco tiempo, salta los ejercicios complementarios (aperturas con banda, curl, tríceps) antes que recortar los pesados.</li></ul></div>';
 h+='<div class="card"><h3>Diástasis abdominal y piso pélvico</h3><ul><li>Esta rutina no incluye plancha ni abdominales tradicionales. El trabajo de abdomen es profundo (transverso), coordinado con la respiración.</li><li>No incluye ejercicios directos de piso pélvico (tipo Kegel). En su lugar hay ejercicios de fuerza de bajo riesgo para esa zona: abducción de cadera con banda, elevación lateral de hombros y elevación de talones, que no generan la presión hacia abajo que sí pueden generar otros ejercicios.</li><li>Regla de oro para toda la rutina: exhala en el esfuerzo (al subir, empujar o tirar) y nunca contengas el aire.</li><li>Señales de que hay que bajar el peso o parar el ejercicio: abultamiento o “cono” en el centro del abdomen, presión hacia abajo en la pelvis, sensación de pesadez o pérdida de orina.</li><li>Los ejercicios más exigentes para esta zona son la caminata del granjero, el press de hombros y las flexiones. Si aparecen esas señales, mantén el peso de la semana anterior.</li><li>Después de casi 5 años, conviene una evaluación con un kinesiólogo o kinesióloga de piso pélvico (o una matrona). Puede decir si conviene agregar trabajo específico de piso pélvico y de qué tipo, cosa que esta app no reemplaza.</li></ul></div>';
 h+='<div class="card"><h3>Seguridad</h3><ul><li>Muestren este plan a la nutricionista o al médico tratante antes de comenzar. Es intensidad moderada, pero cada caso es distinto.</li><li>La meta es terminar cada serie con reservas: nunca llegar al límite.</li><li>Detente si hay dolor agudo, mareo o molestia en articulaciones. El cansancio muscular es normal; el dolor punzante no.</li><li>Antes de cada serie con barra, revisen que los discos tengan seguros.</li></ul></div>';
 h+='<div class="card"><h3>Qué tan pesado debe ser</h3><div class="rpe"><b>6</b><span>Semanas 1–2. Podrías hacer 4 repeticiones más.</span><b>7</b><span>Semanas 3–4. Podrías hacer 3 más.</span><b>8</b><span>Semanas 5–6. Podrías hacer 2 más.</span></div></div>';
 h+='<div class="card"><h3>Cómo subir el peso</h3><ul><li>Si en todas las series llegas al máximo de repeticiones con buena técnica, sube el peso la próxima vez.</li><li>Los pesos que ves en cada ejercicio son un punto de partida prudente para cada semana. Si sobran más de 4 repeticiones en la semana 1 o 2, sube 1,5 kg; si no llegas al mínimo de repeticiones con buena técnica, baja 1,5 kg.</li><li>En la barra Z, los kg se cuentan por lado (los discos de cada lado, sin contar la barra).</li><li>Sube el mínimo: 1,5 kg en torso, 2,5–3 kg en piernas y glúteos.</li><li>Si la técnica se rompe, vuelve al peso anterior. Progresar lento también es progresar.</li><li>Anota los kilos en cada serie: la app te los muestra la próxima vez.</li></ul></div>';
 h+='<div class="card"><h3>Caminata</h3><ul><li>Viernes y domingo: '+WALK.join(' · ')+' minutos, de la semana 1 a la 6.</li><li>En la trotadora: 5–5,5 km/h con pendiente 3–5%. Debes poder hablar, pero no cantar.</li><li>Sube la pendiente antes que la velocidad: cuida más las articulaciones.</li></ul></div>';
 h+='<div class="card"><h3>Equipo</h3><ul><li>Con lo que tienen alcanza para las 6 semanas. No hace falta comprar nada.</li><li>Opcional y barato: un tapete antideslizante para el dead bug, los puentes y la respiración en el suelo, y seguros o collares extra para los discos.</li><li>Si la banda es muy tensa, úsenla solo en las aperturas y el remo sentada.</li></ul></div>';
 h+='<div class="card"><h3>Sobre la técnica</h3><p style="font-size:.93rem">El botón Técnica de cada ejercicio abre el video, el paso a paso escrito y una ilustración opcional (toca "Ver ilustración"). El video necesita internet; la ilustración y el paso a paso funcionan sin conexión, para cuando estén entrenando y no quieran salir de la app.</p></div>';
 return h;
}

function render(){
 const app=document.getElementById('app');
 app.innerHTML=S.tab==='hoy'?viewHoy():S.tab==='semana'?viewSemana():viewGuia();
 const tabs=[['hoy','Hoy'],['semana','Semana'],['guia','Guía']];
 document.getElementById('tabs').innerHTML=tabs.map(t=>'<button data-a="tab" data-t="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+ICONS[t[0]]+t[1]+'</button>').join('');

function updateProgress(){
 const p=progress();
 const b=document.getElementById('pbar'),t=document.getElementById('ptxt');
 if(b)b.style.width=(p.total?p.done/p.total*100:0)+'%';
 if(t)t.textContent=p.done+' / '+p.total;
}

/* ---------- DESCANSO ---------- */
let restEnd=0,restTimer=null;
function startRest(sec,label){
 document.getElementById('restL').textContent=label||'Descanso entre series';
 restEnd=Date.now()+sec*1000;
 document.getElementById('rest').hidden=false;
 clearInterval(restTimer);tick();restTimer=setInterval(tick,250);
}
function tick(){
 const left=Math.max(0,Math.ceil((restEnd-Date.now())/1000));
 document.getElementById('restT').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 if(left<=0){stopRest();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
}
function stopRest(){clearInterval(restTimer);document.getElementById('rest').hidden=true}

/* ---------- ILUSTRACIONES ---------- */
function fL(a,b){return '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>'}
function fFig(j,gear){
 var s='<svg viewBox="0 0 120 100" class="fig"><line x1="4" y1="94" x2="116" y2="94" class="floor"/><g class="body">';
 s+=fL(j.hp,j.sh)+fL(j.sh,j.el)+fL(j.el,j.wr)+fL(j.hp,j.kn)+fL(j.kn,j.an)+fL(j.an,j.to);
 s+='<circle cx="'+j.hd[0]+'" cy="'+j.hd[1]+'" r="7"/></g>';
 if(gear)s+=gear;
 return s+'</svg>';
}
function fDumb(p,dx,dy){dx=dx||8;dy=dy||0;var x1=p[0]-dx,y1=p[1]-dy,x2=p[0]+dx,y2=p[1]+dy;
 return '<line class="gearline" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/><circle class="gear" r="5" cx="'+x1+'" cy="'+y1+'"/><circle class="gear" r="5" cx="'+x2+'" cy="'+y2+'"/>';
}
function fBar(p,q){return '<line class="gearline" x1="'+p[0]+'" y1="'+p[1]+'" x2="'+q[0]+'" y2="'+q[1]+'"/><circle class="gear" r="5" cx="'+p[0]+'" cy="'+p[1]+'"/><circle class="gear" r="5" cx="'+q[0]+'" cy="'+q[1]+'"/>';}
function fBench(x,y,w,h){return '<rect class="bench" x="'+x+'" y="'+y+'" width="'+w+'" height="'+(h||8)+'" rx="3"/>';}
function fBand(p,q){return '<path class="band" d="M'+p[0]+','+p[1]+' Q '+((p[0]+q[0])/2)+','+(((p[1]+q[1])/2)-10)+' '+q[0]+','+q[1]+'"/>';}

 row:function(){return fFig({hd:[30,30],sh:[36,36],el:[46,42],wr:[56,50],hp:[46,52],kn:[62,66],an:[70,90],to:[80,92]},fBench(24,58,44,8)+fDumb([56,50],5,4))},
 ohp:function(){return fFig({hd:[60,18],sh:[60,28],el:[64,16],wr:[62,6],hp:[60,52],kn:[60,70],an:[58,90],to:[70,92]},fBench(46,52,28,8)+fDumb([62,6],7,0))},
 pull:function(){return fFig({hd:[60,16],sh:[60,26],el:[48,30],wr:[38,30],hp:[60,55],kn:[60,74],an:[60,92],to:[70,94]},fBand([38,30],[74,30])+'<circle class="gear" r="4" cx="38" cy="30"/><circle class="gear" r="4" cx="74" cy="30"/>')},
 curl:function(){return fFig({hd:[60,16],sh:[60,26],el:[58,42],wr:[52,32],hp:[60,55],kn:[60,74],an:[60,92],to:[70,94]},fBar([52,32],[52,32]))},
 tri:function(){return fFig({hd:[60,18],sh:[60,28],el:[62,14],wr:[54,26],hp:[60,52],kn:[60,70],an:[58,90],to:[70,92]},fBench(46,52,28,8)+fDumb([54,26],6,4))},
 split:function(){return fFig({hd:[46,20],sh:[46,29],el:[38,40],wr:[36,52],hp:[46,55],kn:[58,72],an:[46,90],to:[54,92]},'<line x1="46" y1="55" x2="70" y2="70" class="gearline" stroke="var(--ink)" stroke-width="5"/><line x1="70" y1="70" x2="76" y2="90" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>')},
 push:function(){return fFig({hd:[92,46],sh:[82,50],el:[70,58],wr:[60,64],hp:[46,58],kn:[26,66],an:[10,72],to:[6,74]},fBench(54,60,10,6))},

};

/* ---------- TÉCNICA ---------- */
function openTech(id){
 const e=EX[id],r=rx(id,S.week);
 const q=VID[id]?'https://www.youtube.com/watch?v='+VID[id]:'https://www.youtube.com/results?search_query='+encodeURIComponent(e.yt||e.name);
 const q2='https://www.youtube.com/results?search_query='+encodeURIComponent(e.name+' técnica');
 let h='<button class="btn x" data-a="close">Cerrar</button><div class="eyebrow">'+e.mu+'</div><h2 style="margin:4px 0 10px">'+e.name+'</h2>';
 h+='<div class="chips"><span class="chip rx">Esta semana: '+r.label+'</span><span class="chip">'+e.eq+'</span></div>';
 h+='<a class="btn primary big" href="'+q+'" target="_blank" rel="noopener noreferrer">Ver video de la técnica</a><p style="margin-top:8px;font-size:.82rem" class="muted">¿No te sirvió? <a href="'+q2+'" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">Buscar otros videos</a></p>';
 h+='<button class="btn" id="illusBtn" data-a="illus" style="margin-top:8px">Ver ilustración</button><div class="illuswrap" id="illusbox" hidden>'+(ILLUS[id]?ILLUS[id]():'')+'</div>';
 h+='<h4>Paso a paso</h4><ol>'+e.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>';
 h+='<h4>Errores comunes</h4><ul>'+e.err.map(s=>'<li>'+s+'</li>').join('')+'</ul>';
 h+='<div class="tip"><b>Consejo:</b> '+e.tip+'</div>';
 if(id!=='transv')h+='<div class="tip"><b>Abdomen y piso pélvico:</b> exhala al hacer el esfuerzo, sin contener el aire. Si aparece un abultamiento en el centro del abdomen, presión hacia abajo en la pelvis o pérdida de orina, baja el peso o haz menos repeticiones.</div>';
 document.getElementById('panel').innerHTML=h;
 document.getElementById('sheet').hidden=false;
}
function closeTech(){document.getElementById('sheet').hidden=true}

/* ---------- PANTALLA ENCENDIDA ---------- */
var AWAKE_OK=('wakeLock' in navigator);
let lock=null;
async function wake(){
 if(!AWAKE_OK||S.awake===false||S.tab!=='hoy'||document.visibilityState!=='visible')return;
 try{if(!lock||lock.released){lock=await navigator.wakeLock.request('screen')}}catch(e){}
}
function unwake(){try{if(lock){lock.release();lock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

/* ---------- EXPORTAR ---------- */
function csv(){
 const rows=[['semana','dia','ejercicio','serie','peso_kg','repeticiones_o_segundos','hecha']];
 const keys=Object.keys(S.logs).sort((a,b)=>{const [wa,da]=a.split('|'),[wb,db]=b.split('|');return (wa*10+DAYS.findIndex(x=>x.k===da))-(wb*10+DAYS.findIndex(x=>x.k===db))});
 keys.forEach(k=>{
  const [w,d]=k.split('|');const day=dayObj(d);
  day.ex.forEach(id=>{
   (S.logs[k][id]||[]).forEach((st,i)=>{
    if(st&&(st.w||st.r||st.d))rows.push([w,day.name,EX[id].name,i+1,st.w||'',st.r||'',st.d?'si':'no']);
   });
  });
 });
 return rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
}
function openExport(){
 const t=csv();
 let h='<button class="btn x" data-a="close">Cerrar</button><div class="eyebrow">Historial</div><h2 style="margin:4px 0 6px">Exportar pesos</h2>';
 h+='<p class="muted" style="font-size:.9rem">Copia el texto y pégalo en Notas, en una planilla o en un mensaje.</p>';
 h+='<textarea class="csv" id="csvbox" readonly>'+esc(t)+'</textarea><div class="row2"><button class="btn primary" data-a="copycsv">Copiar</button>'+(navigator.share?'<button class="btn" data-a="sharecsv">Compartir</button>':'')+'</div><p class="muted" id="csvmsg" style="font-size:.85rem;margin-top:10px"></p>';
 document.getElementById('panel').innerHTML=h;
 document.getElementById('sheet').hidden=false;
}

/* ---------- EVENTOS ---------- */
document.addEventListener('click',ev=>{
 if(ev.target.id==='sheet'){closeTech();return}
 const el=ev.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a;
 if(a==='tab'){S.tab=el.dataset.t;save();render();window.scrollTo(0,0);if(S.tab==='hoy')wake();else unwake()}
 else if(a==='day'){S.day=el.dataset.k;save();render()}
 else if(a==='tech'){openTech(el.dataset.id)}
 else if(a==='close'){closeTech()}
 else if(a==='illus'){const box=document.getElementById('illusbox');box.hidden=!box.hidden;el.textContent=box.hidden?'Ver ilustración':'Ocultar ilustración'}
 else if(a==='export'){openExport()}
 else if(a==='copycsv'){
  const box=document.getElementById('csvbox'),m=document.getElementById('csvmsg');
  const ok=()=>{m.textContent='Copiado.'};
  try{navigator.clipboard.writeText(box.value).then(ok,()=>{box.select();m.textContent='Selecciona el texto y cópialo manualmente.'})}catch(e){box.select();m.textContent='Selecciona el texto y cópialo manualmente.'}
 }
 else if(a==='sharecsv'){try{navigator.share({title:'Historial de fuerza',text:document.getElementById('csvbox').value})}catch(e){}}
 else if(a==='restStop'){stopRest()}
 else if(a==='go'){S.week=Number(el.dataset.w);S.day=el.dataset.k;S.tab='hoy';save();render();window.scrollTo(0,0)}
 else if(a==='finish'){S.done[sk()]=!S.done[sk()];save();render()}
 else if(a==='set'){
  const id=el.dataset.id,i=Number(el.dataset.i);
  const s=getSet(id,i),nd=!s.d;
  setField(id,i,'d',nd);
  const row=el.closest('.set');row.classList.toggle('done',nd);
  if(nd){
   const wi=row.querySelector('[data-f="w"]');
   const r=row.querySelector('[data-f="r"]');
   if(wi&&!wi.value){
    let pv='';for(let j=i-1;j>=0;j--){const q=getSet(id,j);if(q.w){pv=q.w;break}}
    if(!pv)pv=String(sugg(id,S.week).n);
    wi.value=pv;setField(id,i,'w',pv);
   }
   if(r&&!r.value){r.value=r.placeholder;setField(id,i,'r',r.placeholder)}
   const rr=rx(id,S.week),dd=dayObj(S.day),pos=dd.ex.indexOf(id);
   if(i===rr.sets-1){if(pos<dd.ex.length-1)startRest(TRANS,'Cambio de ejercicio: '+EX[dd.ex[pos+1]].name);else stopRest()}
   else startRest(rr.rest,'Descanso entre series');
  }
  updateProgress();
 }
});
document.addEventListener('input',ev=>{
 const el=ev.target;
 if(el.dataset&&el.dataset.f){setField(el.dataset.id,Number(el.dataset.i),el.dataset.f,el.value.replace(',','.'))}
});
document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.id==='awake'){S.awake=el.checked;save();if(el.checked)wake();else unwake()}
 else if(el.id==='selWeek'){S.week=Number(el.value);save();render()}
 else if(el.id==='startDate'&&el.value){S.start=el.value;save();render()}
 else if(el.dataset&&el.dataset.a==='chk'){
  const k=el.dataset.key,i=Number(el.dataset.i);
  S.warm[k]=S.warm[k]||[];S.warm[k][i]=el.checked;save();
 }
});
document.addEventListener('pointerdown',function f(){wake();document.removeEventListener('pointerdown',f)},{once:true});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeTech()});
render();
</script>
